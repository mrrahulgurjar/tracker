name: Build Protocol 90 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build Android APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/tools/bin
          yes | sdkmanager --licenses || true
          cordova create protocol90_app com.protocol90.app "Protocol90"
          cd protocol90_app
          rm -rf www/*
          cp -r ../*.html ../*.css ../*.js ../*.png ../manifest.json www/ || true
          cordova platform add android
          cordova build android --debug

      - name: Prepare APK Output
        run: |
          mkdir -p apk-output
          cp $(find protocol90_app -name "*.apk" | head -n 1) apk-output/Protocol90.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protocol90-APK
          path: apk-output/Protocol90.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: release-${{ github.run_number }}
          name: "Protocol 90 APK Build #${{ github.run_number }}"
          body: "Direct installable APK for Android 6.0 to Android 16+. Ready to install on any device."
          files: apk-output/Protocol90.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
