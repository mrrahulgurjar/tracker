name: Build & Release Protocol 90 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI (Google Trusted Web Activity / Native APK Builder)
        run: |
          npm install -g @bubblewrap/cli

      - name: Generate Android APK Project
        run: |
          mkdir build-apk
          cd build-apk
          # Initialize Bubblewrap project pointing to live app
          bubblewrap init --manifest="https://mrrahulgurjar.github.io/tracker/manifest.json" --skip-pwa-validation || true

      - name: Build Standalone APK via Cordova
        run: |
          npm install -g cordova
          cordova create cordova-app com.protocol90.tracker "Protocol90"
          cd cordova-app
          rm -rf www/*
          cp -r ../*.html ../*.css ../*.js ../*.png ../manifest.json www/ || true
          cordova platform add android@12.0.1
          cordova build android --debug
          mkdir -p ../dist-apk
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../dist-apk/Protocol90-Tracker-v1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protocol90-Android-APK
          path: dist-apk/Protocol90-Tracker-v1.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Protocol 90 APK v1.0.0"
          body: "Direct installable APK for Android 6.0 to Android 16+. Syncs automatically with updates pushed from laptop."
          files: dist-apk/Protocol90-Tracker-v1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
